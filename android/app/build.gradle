plugins { id 'com.android.application' }
def foundation = providers.gradleProperty('foundationDir').get()
def oboe = providers.gradleProperty('oboeDir').get()
def d2r = providers.gradleProperty('d2rDir').get()
android {
    namespace 'org.macnative.android'
    compileSdk 36
    buildFeatures { resValues true }
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'org.macnative.android'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '0.2-runtime'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {
            arguments "-DFOUNDATION_SOURCE_DIR=${foundation}", "-DOBOE_SOURCE_DIR=${oboe}", "-DD2R_SOURCE_DIR=${d2r}"
            targets 'macnative_platform'
        } }
    }
    flavorDimensions 'title'
    productFlavors {
        botw {
            dimension 'title'; applicationIdSuffix '.botw'
            versionCode 4
            versionName '0.4-memory-vulkan'
            resValue 'string','app_name','BOTW Android Preview'
            resValue 'string','title_profile','botw160'
            resValue 'string','game_version','BOTW 1.6.0'
        }
        totk {
            dimension 'title'; applicationIdSuffix '.totk'
            resValue 'string','app_name','TOTK Android Preview'
            resValue 'string','title_profile','totk100'
            resValue 'string','game_version','TOTK 1.0.0'
        }
    }
    externalNativeBuild { cmake { path '../CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
android.sourceSets.main.kotlin.srcDir("${foundation}/modules/input/android/src/main/kotlin")

dependencies {
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "junit:junit:4.13.2"
}
